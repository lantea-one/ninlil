# Ninlil example deployment (Docker Compose).
#
# Runs the single Ninlil host (see Dockerfile) against PostgreSQL instead of the zero-config
# SQLite default, with a named volume for each service's persistent state. Run it from the
# repository root:
#
#   docker compose up --build
#
# then open https://localhost:8443 (a self-signed certificate is generated on first run, so the
# browser warns about it) and sign in with the bootstrap administrator credentials set below.
#
# To run a published image instead of building one, replace each `build:` block below with
# `image: git.lantea.one/lantea-one/ninlil:latest` (or a specific version tag). For a deployment
# of your own, copy this file and adjust the `environment:` blocks: every secret-shaped value
# (passwords, the JWT signing key) is a placeholder that must be changed before anything but a
# local trial.
#
# ---------------------------------------------------------------------------------------------
# Privileged ports
# ---------------------------------------------------------------------------------------------
# Plain DNS (53/udp+tcp) and the REST API/admin console (80/443) use ports below 1024. The image
# runs as an unprivileged user (uid 1654), and it can still bind them inside the container: on a
# bridge network Docker sets `net.ipv4.ip_unprivileged_port_start=0` in the container's network
# namespace. What needs privilege is the host side of `ports:`:
#
#   - Publishing a host port below 1024 (e.g. `"53:53/udp"`) needs a root-run Docker Engine (the
#     usual Linux install) or, for rootless Docker, `CAP_NET_BIND_SERVICE` granted to
#     `rootlesskit` (see Docker's rootless-mode documentation).
#   - This example publishes the REST API/admin console on host ports 8080/8443 so it runs with
#     no host setup; the container still listens on 80/443, so no
#     `NINLIL_DNS_SERVER_WEB_HTTP_PORT`/`..._HTTPS_PORT` override is needed.
#   - Plain DNS is published on host port 53, because DNS clients use port 53 and most operating
#     systems cannot be told otherwise. Without a privileged Docker Engine, remap it for local
#     testing only: change the host publish and `NINLIL_DNS_SERVER_PROTOCOL_PLAIN_PORT` together
#     (e.g. `"5300:5300/udp"` with `NINLIL_DNS_SERVER_PROTOCOL_PLAIN_PORT=5300`), and LAN clients
#     can no longer use it as their resolver.
#   - On a Linux desktop, `systemd-resolved` usually holds port 53 for its stub listener
#     (127.0.0.53/127.0.0.54), so publishing `"53:53"` fails with "address already in use".
#     Disable the stub listener on that host, or remap the port as above.
#
# ---------------------------------------------------------------------------------------------
# DHCP and Router Advertisement
# ---------------------------------------------------------------------------------------------
# The `ninlil` service runs on Docker's default bridge network with individual ports published.
# That works for DNS and the REST API/admin console, but DHCP and RA must see broadcast and
# multicast traffic from LAN clients (a DHCPv4 DISCOVER goes to 255.255.255.255; RA uses ICMPv6
# multicast), which the NATed bridge network does not forward. This holds for any containerized
# DHCP/RA server.
#
# The `ninlil-host-network` service, behind the `host-network` Compose profile, is the
# alternative: it joins the host's network namespace (`network_mode: host`), so its listeners see
# LAN traffic as a bare-metal install would. On the host's network the unprivileged-port
# allowance above no longer applies, and DHCP/RA also need raw sockets, so it runs as root. The
# capabilities it needs (NET_RAW, NET_BIND_SERVICE) are in Docker's default set. Run one service
# or the other, never both (they bind the same host ports); the profile keeps it out of a plain `docker compose up`:
#
#   docker compose --profile host-network up --build ninlil-host-network postgres
#
# The host-network service runs as root, so the files it creates in the `ninlil-data` volume are
# root-owned. The bridge service runs as uid 1654 and cannot write them. Before going back to it,
# hand the volume over (Compose names it `<project>_ninlil-data`; the project defaults to the
# name of this directory, so check `docker volume ls`):
#
#   docker run --rm -v ninlil_ninlil-data:/d alpine chown -R 1654:1654 /d
#
# ---------------------------------------------------------------------------------------------

services:
  # The Ninlil host -- REST API, DNS engine and the Angular admin console in one process -- on
  # bridge networking: DNS, API and admin console only, no DHCP/RA (see the note above).
  ninlil:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # REST API, admin console, SignalR and (when enabled) DNS-over-HTTPS, on unprivileged host
      # ports; the container listens on its default 80/443.
      - "8080:80"
      - "8443:443"
      # Plain DNS, on host port 53 (see "Privileged ports" above).
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      # The PostgreSQL service below instead of the SQLite default. See the "Storage engine"
      # section of ENVIRONMENT.md for the other engines (MySql, SqlServer, MongoDb).
      NINLIL_STORAGE_ENGINE: PostgreSql
      NINLIL_STORAGE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=ninlil;Username=ninlil;Password=change-me-too"
      # The bootstrap administrator, created on first start. Without a password here, a random
      # one is printed once to the container log, which is easy to miss in `docker compose up`
      # output. Change it, and consider disabling the account once you have created a scoped one
      # in the admin console. The password must meet the default password policy (12+
      # characters, with an uppercase letter, a lowercase letter, a digit and a non-alphanumeric
      # character); otherwise the account is not created and only a log line says why.
      NINLIL_IDENTITY_BOOTSTRAP_ADMINISTRATOR_USER_NAME: admin
      NINLIL_IDENTITY_BOOTSTRAP_ADMINISTRATOR_PASSWORD: "Change-Me-Now1!"
      # Optional: the JWT signing key. Left unset, Ninlil generates one on first start and keeps
      # it in the /app/data volume (jwt-signing-key.txt), so it survives recreating the
      # container. Set it (32+ bytes once UTF-8 encoded) only when you need a known key ahead of
      # time.
      # NINLIL_JWT_SIGNING_KEY: "replace-with-a-real-random-secret-at-least-32-bytes-long"
    volumes:
      # Keeps the generated Data Protection key ring, JWT signing key, self-signed TLS
      # certificate, DNSCrypt provider keys, the runtime appsettings.json and, with the SQLite
      # engine, the database (see the Dockerfile's comments on /app/data). Without it, every
      # encrypted secret (TSIG keys, DNSSEC private keys, cloud credentials, TOTP seeds) becomes
      # unreadable once the container is recreated.
      - ninlil-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The same image on host networking, for DHCPv4/DHCPv6/Router Advertisement (see "DHCP and
  # Router Advertisement" above). Starts only with the `host-network` profile; never run it
  # alongside the `ninlil` service, since both bind the same host ports.
  ninlil-host-network:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - host-network
    network_mode: host
    # Root, for DHCP/RA on the host's network. Docker's default capabilities (NET_RAW for the
    # Router Advertisement socket, NET_BIND_SERVICE for ports 67 and 547) are enough.
    user: "0:0"
    environment:
      NINLIL_STORAGE_ENGINE: PostgreSql
      # Host networking has no Compose service-name DNS, so the database is addressed through
      # the host's loopback. The `postgres` service below publishes its port on 127.0.0.1:55432
      # only (an unusual port, so a PostgreSQL already running on the host's 5432 does not clash).
      NINLIL_STORAGE_CONNECTION_STRING: "Host=127.0.0.1;Port=55432;Database=ninlil;Username=ninlil;Password=change-me-too"
      NINLIL_IDENTITY_BOOTSTRAP_ADMINISTRATOR_USER_NAME: admin
      NINLIL_IDENTITY_BOOTSTRAP_ADMINISTRATOR_PASSWORD: "Change-Me-Now1!"
      # Turn on the local (non-relay) DHCPv4/DHCPv6 engines and Router Advertisement, all off by
      # default. Scopes, reservations and tag rules are configured afterward through the REST
      # API or admin console; see the DHCP section of ENVIRONMENT.md.
      NINLIL_DHCP_SERVER_PROTOCOL_DHCPV4_ENABLE: "true"
      NINLIL_DHCP_SERVER_PROTOCOL_DHCPV6_ENABLE: "true"
      NINLIL_DHCP_SERVER_PROTOCOL_RA_ENABLE: "true"
    volumes:
      - ninlil-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL for the `ninlil` service above and for `ninlil-host-network`, which reaches it on
  # the published loopback port. The credentials are placeholders for a local trial; change them together with
  # `NINLIL_STORAGE_CONNECTION_STRING`.
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    environment:
      POSTGRES_DB: ninlil
      POSTGRES_USER: ninlil
      POSTGRES_PASSWORD: change-me-too
    ports:
      # Loopback only, so the database is not exposed to the LAN.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninlil -d ninlil"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  # Ninlil's persistent state; see the `ninlil` service's volume comment above.
  ninlil-data:
  # PostgreSQL's data directory.
  postgres-data:
