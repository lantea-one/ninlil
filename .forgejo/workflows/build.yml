name: 'Build'
##
## Every push to any branch other than a release branch builds, tests, and publishes a
## pre-release -- binaries, a container image, and (from the same version) NuGet packages --
## versioned v<yyyy>.<mm>.<dd>.<increment>R<branch>+<short-sha>. Pre-releases expire after
## 24 hours (cleanup.yml). A branch build can also be started by hand ("Run workflow" on the
## Actions page, or the dispatch API), for example to rebuild after a runner problem without
## pushing a commit. Pull requests do not run here: pull-request.yml runs their tests only.
##
## Input: a push or a hand-started run of a branch. Output: a pre-release (pipeline.yml).
##
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]+'
##
## Builds of one branch queue behind each other rather than overlapping, because each takes the
## next free increment for that branch and day.
##
concurrency:
  group: >-
    build-branch-${{ forgejo.ref_name }}
  cancel-in-progress: false
jobs:
  ##
  ## The whole pipeline, as a pre-release build. The kind is a literal, not computed from the
  ## event, so no expression decides what this workflow publishes.
  ##
  pipeline:
    name: 'Pipeline'
    uses: './.forgejo/workflows/pipeline.yml'
    secrets: inherit
    with:
      kind: 'prerelease'
