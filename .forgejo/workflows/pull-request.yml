name: 'Build'
##
## A pull request into develop or main runs the tests only: the lint job, the .NET tests without
## the Docker socket and without the tests marked RequiresDocker, and the admin console tests.
## It computes no version and builds, packs, pushes and publishes nothing, because the code is not
## reviewed yet and the branch push build already published its pre-release. The develop or main
## push build after the merge covers the rest.
##
## The workflow is called 'Build', like build.yml, so a pull request's commit status stays
## "Build / Pipeline (pull_request)". It is a file of its own, and passes the literal kind
## 'verify', so no expression chooses between a test run and a publishing run.
##
## No secrets are passed on (no 'secrets: inherit'): a tests-only run needs none, and the code under
## test must not see them.
##
## Input: a pull request into develop or main (a fork's run waits for a maintainer's approval).
## Output: the commit status of the pull request and the test results as run artifacts.
##
on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
##
## Runs for one pull request queue behind each other rather than overlapping. The head branch
## name is the group; the ref name (<number>/merge) stands in when the runner leaves head_ref empty.
##
concurrency:
  group: >-
    build-pull-request-${{ forgejo.head_ref || forgejo.ref_name }}
  cancel-in-progress: false
jobs:
  ##
  ## The whole pipeline, as a tests-only build.
  ##
  pipeline:
    name: 'Pipeline'
    uses: './.forgejo/workflows/pipeline.yml'
    with:
      kind: 'verify'
