name: 'Expire Pre-Releases'
##
## Removes every pre-release build -- release, git tag, container image tag, and NuGet package
## version -- and every stale draft once it is 24 hours old, plus this runner's superseded
## ninlil-builder images. Published releases are never touched. Runs every hour at minute 17, or by hand ("Run workflow") with an optional dry run.
## See .forgejo/scripts/cleanup.sh for the rules.
##
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      ##
      ## Hand-started runs only; the scheduled run always removes.
      ##
      dry-run:
        default: false
        description: 'List what would be removed without removing anything.'
        required: false
        type: boolean
##
## Two runs never delete at the same time.
##
concurrency:
  group: 'expire-pre-releases'
  cancel-in-progress: false
jobs:
  ##
  ## Runs cleanup.sh on the runner itself; it needs only curl, jq and the CI token.
  ##
  cleanup:
    name: 'Expire Pre-Releases'
    runs-on: 'asgard'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Remove Pre-Releases Older Than 24 Hours'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
          DRY_RUN: '${{ inputs.dry-run || false }}'
        run: |-
          ./.forgejo/scripts/cleanup.sh
        shell: 'bash'
      ##
      ## A changed docker/ci.Dockerfile, or two cold builds at once, leave superseded builder
      ## images untagged on this runner (in-container.sh tags them ninlil-builder-<toolchain> and
      ## labels them ninlil.builder). Remove the untagged ones built more than 24 hours ago: the
      ## label filter leaves every other image alone, a job has long started its container by
      ## then, and Docker refuses to remove an image a container still uses.
      ##
      - name: 'Remove Superseded Builder Images'
        if: >-
          ${{ !inputs.dry-run }}
        run: |-
          docker image prune --force --filter 'label=ninlil.builder' --filter 'until=24h'
        shell: 'bash'
