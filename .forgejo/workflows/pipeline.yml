name: 'Ninlil Pipeline'
##
## The build, test, and publish pipeline shared by every entry point: branch builds
## (build.yml), release builds (release.yml), and pull-request verification (build.yml).
##
## Every build and test step runs in a throwaway container of one of the toolchains in
## docker/ci.Dockerfile (.NET SDK; Node.js with Java and Chromium; makepkg; shellcheck and
## actionlint; nFPM), through .forgejo/scripts/in-container.sh, with only the checkout mounted.
## The runners
## (all labelled 'archlinux') need just Docker (with buildx), git, curl, and jq, for the version,
## the release API calls, and the container image, which is the prebuilt Linux executables copied
## onto a chiseled base. Everything cross-compiles, so any runner builds every platform; the arch
## toolchain image is amd64-only, so an arm64 runner needs amd64 emulation (binfmt) for it. The
## Deb and RPM install test pulls Debian, Ubuntu, Rocky Linux and Fedora images from
## public.ecr.aws and quay.io.
##
## Tests run as the runner's unprivileged user inside a container on Docker's bridge network, so
## they never collide with the DNS, DHCP, web, and database services the runners host; every
## test listener (Karma's included) also takes a port the operating system reports as free, so
## two copies of the suite never meet.
##
## Job graph (the tests and lint start alongside version; 'verify' runs only test-dotnet,
## test-admin-console and lint):
##
##   version ────────────┐
##   lint ───────────────┤
##   test-dotnet ────────┼─ draft ── binaries (×5) ─┬─ arch-packages ───┬─ publish
##   test-admin-console ─┤                          ├─ linux-packages ──┤
##                       │                          ├─ image ───────────┤
##                       │                          └─ windows-smoke ───┤
##                       └─ packages (×4) ──────────────────────────────┘
##
## The draft release doubles as the hand-off between jobs: each binary job attaches its
## executable to it, the Arch Linux, Deb/RPM and image jobs build from the two Linux executables
## they download back from it, and the Windows smoke test runs the Windows executable it
## downloads. Publish turns the draft into the visible release.
##
## No run: body contains a ${{ }} expression. Every value reaches a script through env:, so a
## branch name can never become shell text.
##
on:
  workflow_call:
    inputs:
      ##
      kind:
        description: >-
          'prerelease' for a branch build, 'release' for a release branch build, or 'verify' to
          run only the tests (pull requests).
        required: true
        type: string
env:
  REGISTRY: 'git.lantea.one'
  IMAGE: 'git.lantea.one/lantea-one/ninlil'
  PLATFORMS: 'linux/amd64,linux/arm64'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  ##
  ## Computes every form of the version (compute-version.sh). Skipped for 'verify'.
  ##
  version:
    name: 'Compute Version'
    if: >-
      inputs.kind != 'verify'
    runs-on: 'archlinux'
    outputs:
      version: '${{ steps.version.outputs.version }}'
      assembly-version: '${{ steps.version.outputs.assembly-version }}'
      package-version: '${{ steps.version.outputs.package-version }}'
      image-version: '${{ steps.version.outputs.image-version }}'
      arch-version: '${{ steps.version.outputs.arch-version }}'
      deb-version: '${{ steps.version.outputs.deb-version }}'
      rpm-version: '${{ steps.version.outputs.rpm-version }}'
      rpm-release: '${{ steps.version.outputs.rpm-release }}'
      prerelease: '${{ steps.version.outputs.prerelease }}'
      short-sha: '${{ steps.version.outputs.short-sha }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          ref: '${{ forgejo.sha }}'
      ##
      ## A release branch must point at a commit on main.
      ##
      - name: 'Require Release Commits to Come From main'
        if: >-
          inputs.kind == 'release'
        env:
          COMMIT_SHA: '${{ forgejo.sha }}'
          REF_NAME: '${{ forgejo.ref_name }}'
        run: |-
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${COMMIT_SHA}" origin/main; then
            echo "::error::Release branch ${REF_NAME} points at ${COMMIT_SHA}, which is not on main. Releases can only be cut from main."
            exit 1
          fi
        shell: 'bash'
      ##
      - name: 'Compute Version'
        id: 'version'
        env:
          BUILD_KIND: '${{ inputs.kind }}'
          REF_NAME: '${{ forgejo.ref_name }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
        run: |-
          ./.forgejo/scripts/compute-version.sh
        shell: 'bash'
  ##
  ## Format check, build and every .NET test project. Runs for every kind, with no dependencies.
  ##
  test-dotnet:
    name: 'Test .NET'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Build the Admin Console'
        run: |-
          # The web host's integration tests serve the built admin console (SPA fallback routing,
          # static assets), as a published host does.
          ./.forgejo/scripts/in-container.sh node ./.forgejo/scripts/build-admin-console.sh
        shell: 'bash'
      ##
      - name: 'Format Check and Build'
        run: |-
          ./.forgejo/scripts/in-container.sh dotnet bash -c '
            set -euo pipefail
            dotnet tool restore
            dotnet csharpier check .
            dotnet build Ninlil.slnx --configuration Release -p:NinlilSkipAngularBuild=true
          '
        shell: 'bash'
      ##
      - name: 'Run Every Test Project'
        env:
          BUILD_KIND: '${{ inputs.kind }}'
        run: |-
          # The live DNSSEC key-rollover test compresses a full rollover into two-second TTLs, so
          # it is sensitive to CPU contention while the other test projects run in parallel. It
          # runs alone, after everything else, rather than being skipped. The PostgreSQL
          # query-log tests start a database container (Testcontainers) and carry the
          # RequiresDocker category. Pull-request builds (verify) run code nobody has reviewed
          # yet, so they get no Docker socket (it is root-equivalent on the runner host) and skip
          # that category. Every other kind hands the container the socket and runs everything;
          # a same-repo branch is pushed before its pull request, so its push build covers them.
          docker_flag=(--docker)
          category_filter=''
          if [[ "${BUILD_KIND}" == 'verify' ]]; then
              docker_flag=()
              category_filter=' & Category!=RequiresDocker'
          fi
          ./.forgejo/scripts/in-container.sh "${docker_flag[@]}" dotnet bash -c '
            set -euo pipefail
            timing_sensitive="DnssecKeyRolloverZskPrePublishLiveTests"
            dotnet test Ninlil.slnx --no-build --configuration Release \
              --filter "FullyQualifiedName!~${timing_sensitive}${1}"
            dotnet test Ninlil.slnx --no-build --configuration Release \
              --filter "FullyQualifiedName~${timing_sensitive}${1}"
          ' _ "${category_filter}"
        shell: 'bash'
  ##
  ## Lint, format check and the Karma suite of the Angular admin console. Runs for every kind,
  ## with no dependencies.
  ##
  test-admin-console:
    name: 'Test Admin Console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Install Dependencies'
        run: |-
          ./.forgejo/scripts/in-container.sh node bash -c '
            cd src/angular
            npm ci --no-audit --no-fund
          '
        shell: 'bash'
      ##
      - name: 'Lint and Format Check'
        run: |-
          ./.forgejo/scripts/in-container.sh node bash -c '
            set -euo pipefail
            cd src/angular
            npm run lint
            npm run format:check
          '
        shell: 'bash'
      ##
      - name: 'Run the Jasmine/Karma Suite'
        run: |-
          # Headless Chromium; Karma listens on a free loopback port (karma.conf.js).
          ./.forgejo/scripts/in-container.sh node bash -c '
            cd src/angular
            npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox
          '
        shell: 'bash'
  ##
  ## Lints the shell scripts (shellcheck) and the workflows (actionlint), then runs the script
  ## self-tests (.forgejo/scripts/lint.sh). Runs for every kind, with no dependencies; draft and
  ## packages wait for it, so nothing is published while it fails.
  ##
  lint:
    name: 'Lint and Script Tests'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Run Lint and the Script Self-Tests'
        run: |-
          ./.forgejo/scripts/in-container.sh lint ./.forgejo/scripts/lint.sh
        shell: 'bash'
  ##
  ## Creates the draft release the later jobs attach to, once both test jobs and lint pass.
  ##
  draft:
    name: 'Stage Draft Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'lint'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Create the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
          RELEASE_PRERELEASE: '${{ needs.version.outputs.prerelease }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
          DEB_VERSION: '${{ needs.version.outputs.deb-version }}'
          RPM_VERSION: '${{ needs.version.outputs.rpm-version }}'
          RPM_RELEASE: '${{ needs.version.outputs.rpm-release }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
          REF_NAME: '${{ forgejo.ref_name }}'
        run: |-
          ./.forgejo/scripts/release.sh stage
        shell: 'bash'
  ##
  ## One self-contained executable per platform, attached to the draft.
  ##
  binaries:
    name: 'Build Binary (${{ matrix.binary }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'draft'
    runs-on: 'archlinux'
    strategy:
      matrix:
        ## 'file' is the name publish-binary.sh writes (the Windows one ends in .exe).
        include:
          - binary: 'linux-amd64'
            file: 'ninlil-linux-amd64'
          - binary: 'linux-arm64'
            file: 'ninlil-linux-arm64'
          - binary: 'macos-amd64'
            file: 'ninlil-macos-amd64'
          - binary: 'macos-arm64'
            file: 'ninlil-macos-arm64'
          - binary: 'windows-amd64'
            file: 'ninlil-windows-amd64.exe'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Build the Admin Console'
        run: |-
          ./.forgejo/scripts/in-container.sh node ./.forgejo/scripts/build-admin-console.sh
        shell: 'bash'
      ##
      - name: 'Build ninlil-${{ matrix.binary }}'
        env:
          BUILD_VERSION: '${{ needs.version.outputs.version }}'
          BUILD_PACKAGE_VERSION: '${{ needs.version.outputs.package-version }}'
          BUILD_ASSEMBLY_VERSION: '${{ needs.version.outputs.assembly-version }}'
          BINARY: '${{ matrix.binary }}'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/in-container.sh dotnet \
            ./.forgejo/scripts/publish-binary.sh "${BINARY}" dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
          BINARY_FILE: '${{ matrix.file }}'
        run: |-
          ./.forgejo/scripts/release.sh upload "dist/${BINARY_FILE}"
        shell: 'bash'
  ##
  ## The ninlil Arch Linux packages, built from the two Linux executables on the draft.
  ##
  arch-packages:
    name: 'Build Arch Linux Packages'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    env:
      NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
      RELEASE_TAG: '${{ needs.version.outputs.version }}'
      ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build the ninlil Packages for x86_64 and aarch64'
        run: |-
          ./.forgejo/scripts/in-container.sh arch ./.forgejo/scripts/arch-packages.sh dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        run: |-
          ./.forgejo/scripts/release.sh upload dist/ninlil-*.pkg.tar.zst
        shell: 'bash'
  ##
  ## The ninlil Debian and RPM packages for amd64/x86_64 and arm64/aarch64, built by nFPM from
  ## the two Linux executables on the draft in one amd64 run (the packages only copy files, so
  ## nothing is emulated). Before they are attached, the amd64 packages are installed in
  ## disposable Debian 12, Ubuntu 22.04, Ubuntu 24.04, Rocky Linux 9 and Fedora 41 containers
  ## (linux-packages-smoke.sh), where the executable must start and answer /status. The arm64
  ## packages are built but not run, because that would need emulation on the runner.
  ##
  linux-packages:
    name: 'Build and Test Deb and RPM Packages'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    env:
      NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
      RELEASE_TAG: '${{ needs.version.outputs.version }}'
      DEB_VERSION: '${{ needs.version.outputs.deb-version }}'
      RPM_VERSION: '${{ needs.version.outputs.rpm-version }}'
      RPM_RELEASE: '${{ needs.version.outputs.rpm-release }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build the Deb and RPM Packages'
        run: |-
          ./.forgejo/scripts/in-container.sh packages ./.forgejo/scripts/linux-packages.sh dist
        shell: 'bash'
      ##
      - name: 'Install and Start the Packages in Distribution Containers'
        run: |-
          ./.forgejo/scripts/linux-packages-smoke.sh dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        run: |-
          ./.forgejo/scripts/release.sh upload dist/ninlil_*.deb dist/ninlil-*.rpm
        shell: 'bash'
  ##
  ## The multi-platform container image, built from the two Linux executables on the draft and
  ## pushed to the Forgejo container registry.
  ##
  image:
    name: 'Build and Push Image'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build and Push linux/amd64 and linux/arm64'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          PRERELEASE: '${{ needs.version.outputs.prerelease }}'
          BUILD_VERSION: '${{ needs.version.outputs.version }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
        run: |-
          # Registry credentials live in a throwaway configuration directory for this job only,
          # never in the runner user's ~/.docker, which every other job on this host shares.
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${NINLIL_CI_TOKEN}" \
            | docker login "${REGISTRY}" --username "${NINLIL_CI_USER}" --password-stdin

          # A pre-release gets only its unique version tag, so cleanup.sh can remove it alone; a
          # release is also tagged latest.
          tags=(--tag "${IMAGE}:${IMAGE_VERSION}")
          if [[ "${PRERELEASE}" == 'false' ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi

          docker buildx build --progress=plain \
            --platform "${PLATFORMS}" \
            --target runtime \
            --build-context binaries=dist \
            --build-arg "BUILD_VERSION=${BUILD_VERSION}" \
            --build-arg "BUILD_REVISION=${COMMIT_SHA}" \
            "${tags[@]}" \
            --provenance=false \
            --push \
            .
        shell: 'bash'
  ##
  ## NuGet packages for the libraries, one matrix job per family, pushed to the Forgejo NuGet
  ## registry. Runs alongside the draft, binaries and image jobs once the tests and lint pass.
  ##
  packages:
    name: 'Pack and Push NuGet Packages (${{ matrix.family }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'lint'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    strategy:
      matrix:
        include:
          - family: 'common'
            projects: 'Ninlil.Common.*'
          - family: 'dns-core'
            projects: 'Ninlil.Dns.Common Ninlil.Dns.Data.* Ninlil.Dns.Identity'
          - family: 'dns-server'
            projects: 'Ninlil.Dns.Protocol.* Ninlil.Dns.Server.*'
          - family: 'dhcp'
            projects: 'Ninlil.Dhcp.*'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Pack ${{ matrix.projects }}'
        env:
          BUILD_VERSION: '${{ needs.version.outputs.version }}'
          BUILD_PACKAGE_VERSION: '${{ needs.version.outputs.package-version }}'
          BUILD_ASSEMBLY_VERSION: '${{ needs.version.outputs.assembly-version }}'
          PROJECTS: '${{ matrix.projects }}'
        run: |-
          rm -rf packages
          ./.forgejo/scripts/in-container.sh dotnet \
            ./.forgejo/scripts/pack-packages.sh "${PROJECTS}" packages
        shell: 'bash'
      ##
      - name: 'Push to the Forgejo NuGet Registry'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
          SERVER_URL: '${{ forgejo.server_url }}'
          REPOSITORY_OWNER: '${{ forgejo.repository_owner }}'
        run: |-
          # The feed's PackagePublish endpoint (see its index.json); a trailing slash is a 404.
          feed="${SERVER_URL}/api/packages/${REPOSITORY_OWNER}/nuget"
          # The credentials go to curl in a private config file, not on its command line.
          # shellcheck source=/dev/null
          source ./.forgejo/scripts/forgejo-api.sh
          nuget_config=''
          forgejo_write_config nuget_config user "${NINLIL_CI_USER}:${NINLIL_CI_TOKEN}"
          response="${forgejo_work}/response"
          for package in packages/*.nupkg; do
            status="$(curl --silent --show-error --output "${response}" --write-out '%{http_code}' \
              --config "${nuget_config}" \
              --upload-file "${package}" \
              "${feed}")"
            case "${status}" in
              201) echo "Pushed $(basename "${package}")" ;;
              # Already published by an earlier attempt of this same run.
              409) echo "Already published: $(basename "${package}")" ;;
              *)
                echo "::error::Pushing $(basename "${package}") failed with HTTP ${status}: $(cat "${response}")"
                exit 1
                ;;
            esac
          done
        shell: 'bash'
  ##
  ## Starts the Windows executable from the draft on the Windows runner and checks /status, the
  ## admin console and one DNS query (windows-smoke.ps1). A smoke test only; there is no Windows
  ## test suite. 'windows-latest' is the label the Windows runner registers; if that runner
  ## registers only under its own name, change the label to 'lofnheim' (both are declared in
  ## .forgejo/actionlint.yaml). Windows PowerShell 5.1 is always installed there, so the step
  ## uses it instead of requiring pwsh.
  ##
  windows-smoke:
    name: 'Smoke Test the Windows Binary'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'windows-latest'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Run the Windows Executable'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
          FORGEJO_SERVER_URL: '${{ forgejo.server_url }}'
          FORGEJO_REPOSITORY: '${{ forgejo.repository }}'
        run: |-
          .\.forgejo\scripts\windows-smoke.ps1 -ReleaseTag $env:RELEASE_TAG -Asset ninlil-windows-amd64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: 'powershell'
  ##
  ## Turns the draft into the visible release once every artifact is in place.
  ##
  publish:
    name: 'Publish Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
      - 'windows-smoke'
      - 'arch-packages'
      - 'linux-packages'
      - 'image'
      - 'packages'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Publish the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          ./.forgejo/scripts/release.sh publish
        shell: 'bash'
