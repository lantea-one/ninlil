name: 'Ninlil Pipeline'
##
## The build, test, and publish pipeline shared by every entry point: branch builds
## (build.yml), release builds (release.yml), and pull-request verification (build.yml).
##
## Every 'archlinux' runner has the .NET SDK, msquic, and makepkg installed, so the .NET work --
## the tests, the self-contained binaries, and the NuGet packages -- runs directly on the runner,
## and the Arch Linux packages are built with its own makepkg. Docker covers the rest: the admin
## console (Node.js, Java, and Chromium live in its build image, not on the runners) and the
## container image, which is only the prebuilt Linux executables copied onto a chiseled base.
## Everything cross-compiles, so any runner builds every platform.
##
## Tests run natively as the runner's unprivileged user, so they cannot bind a port below 1024;
## every test listener takes a port the operating system reports as free, so none of them can
## collide with the DNS, DHCP, web, and database services the runners host, or with another copy
## of the suite running on the same runner.
##
## Job graph:
##
##   version ─┬─ test-dotnet ────────┬─ draft ── binaries (×4) ─┬─ arch-packages ─┬─ publish
##            └─ test-admin-console ─┤                          └─ image ─────────┤
##                                   └─ packages (×4) ────────────────────────────┘
##
## The draft release doubles as the hand-off between jobs: each binary job attaches its
## executable to it, and the Arch Linux and image jobs build from the two Linux executables they
## download back from it. Publish turns the draft into the visible release.
##
on:
  workflow_call:
    inputs:
      ##
      kind:
        description: >-
          'prerelease' for a branch build, 'release' for a release branch build, or 'verify' to
          run only the tests (pull requests).
        required: true
        type: string
env:
  REGISTRY: 'git.lantea.one'
  IMAGE: 'git.lantea.one/lantea.one/ninlil'
  PLATFORMS: 'linux/amd64,linux/arm64'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  ##
  version:
    name: 'Compute Version'
    if: >-
      inputs.kind != 'verify'
    runs-on: 'archlinux'
    outputs:
      version: '${{ steps.version.outputs.version }}'
      assembly-version: '${{ steps.version.outputs.assembly-version }}'
      package-version: '${{ steps.version.outputs.package-version }}'
      image-version: '${{ steps.version.outputs.image-version }}'
      arch-version: '${{ steps.version.outputs.arch-version }}'
      prerelease: '${{ steps.version.outputs.prerelease }}'
      short-sha: '${{ steps.version.outputs.short-sha }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          fetch-depth: 0
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Require Release Commits to Come From main'
        if: >-
          inputs.kind == 'release'
        run: |-
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ forgejo.sha }}" origin/main; then
            echo "::error::Release branch ${{ forgejo.ref_name }} points at ${{ forgejo.sha }}, which is not on main. Releases can only be cut from main."
            exit 1
          fi
        shell: 'bash'
      ##
      - name: 'Compute Version'
        id: 'version'
        env:
          BUILD_KIND: '${{ inputs.kind }}'
          REF_NAME: '${{ forgejo.ref_name }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
        run: |-
          ./.forgejo/scripts/compute-version.sh
        shell: 'bash'
  ##
  test-dotnet:
    name: 'Test .NET'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Build the Admin Console'
        run: |-
          # The web host's integration tests serve the real admin console (SPA fallback routing,
          # static assets), exactly as a published host does.
          docker buildx build --progress=plain --target admin-console-dist \
            --output type=local,dest=src/dotnet/src/Ninlil.Web/wwwroot .
        shell: 'bash'
      ##
      - name: 'Format Check and Build'
        run: |-
          dotnet tool restore
          dotnet csharpier check .
          dotnet build Ninlil.slnx --configuration Release -p:NinlilSkipAngularBuild=true
        shell: 'bash'
      ##
      - name: 'Run Every Test Project'
        run: |-
          # The live DNSSEC key-rollover test compresses a real rollover into two-second TTLs, so
          # it is sensitive to CPU contention while the other test projects run in parallel. It
          # runs on its own, after everything else, rather than being skipped.
          timing_sensitive='DnssecKeyRolloverZskPrePublishLiveTests'
          dotnet test Ninlil.slnx --no-build --configuration Release \
            --filter "FullyQualifiedName!~${timing_sensitive}"
          dotnet test Ninlil.slnx --no-build --configuration Release \
            --filter "FullyQualifiedName~${timing_sensitive}"
        shell: 'bash'
  ##
  test-admin-console:
    name: 'Test Admin Console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Lint, Format Check, and Test'
        run: |-
          docker buildx build --progress=plain --target test-admin-console .
        shell: 'bash'
  ##
  draft:
    name: 'Stage Draft Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Create the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
          RELEASE_PRERELEASE: '${{ needs.version.outputs.prerelease }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
          REF_NAME: '${{ forgejo.ref_name }}'
        run: |-
          ./.forgejo/scripts/release.sh stage
        shell: 'bash'
  ##
  binaries:
    name: 'Build Binary (${{ matrix.binary }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'draft'
    runs-on: 'archlinux'
    strategy:
      matrix:
        binary:
          - 'linux-amd64'
          - 'linux-arm64'
          - 'macos-amd64'
          - 'macos-arm64'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Build the Admin Console'
        run: |-
          docker buildx build --progress=plain --target admin-console-dist \
            --output type=local,dest=src/dotnet/src/Ninlil.Web/wwwroot .
        shell: 'bash'
      ##
      - name: 'Build ninlil-${{ matrix.binary }}'
        env:
          BUILD_VERSION: '${{ needs.version.outputs.version }}'
          BUILD_PACKAGE_VERSION: '${{ needs.version.outputs.package-version }}'
          BUILD_ASSEMBLY_VERSION: '${{ needs.version.outputs.assembly-version }}'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/publish-binary.sh '${{ matrix.binary }}' dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          ./.forgejo/scripts/release.sh upload "dist/ninlil-${{ matrix.binary }}"
        shell: 'bash'
  ##
  arch-packages:
    name: 'Build Arch Linux Packages'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    env:
      NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
      RELEASE_TAG: '${{ needs.version.outputs.version }}'
      ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build ninlil-bin for x86_64 and aarch64'
        run: |-
          ./.forgejo/scripts/arch-packages.sh dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        run: |-
          ./.forgejo/scripts/release.sh upload dist/ninlil-bin-*.pkg.tar.zst
        shell: 'bash'
  ##
  image:
    name: 'Build and Push Image'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build and Push linux/amd64 and linux/arm64'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          PRERELEASE: '${{ needs.version.outputs.prerelease }}'
        run: |-
          # Registry credentials live in a throwaway configuration directory for this job only,
          # never in the runner user's own ~/.docker, which every other job on this host shares.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${NINLIL_CI_TOKEN}" \
            | docker login "${REGISTRY}" --username "${NINLIL_CI_USER}" --password-stdin

          # A pre-release is tagged with its own unique version only, so it can expire on its
          # own; a release is also tagged latest.
          tags=(--tag "${IMAGE}:${IMAGE_VERSION}")
          if [[ "${PRERELEASE}" == 'false' ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi

          docker buildx build --progress=plain \
            --platform "${PLATFORMS}" \
            --target runtime \
            --build-context binaries=dist \
            --build-arg "BUILD_VERSION=${{ needs.version.outputs.version }}" \
            --build-arg "BUILD_REVISION=${{ forgejo.sha }}" \
            "${tags[@]}" \
            --provenance=false \
            --push \
            .
        shell: 'bash'
  ##
  packages:
    name: 'Pack and Push NuGet Packages (${{ matrix.family }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    strategy:
      matrix:
        include:
          - family: 'common'
            projects: 'Ninlil.Common.*'
          - family: 'dns-core'
            projects: 'Ninlil.Dns.Common Ninlil.Dns.Data.* Ninlil.Dns.Identity'
          - family: 'dns-server'
            projects: 'Ninlil.Dns.Protocol.* Ninlil.Dns.Server.*'
          - family: 'dhcp'
            projects: 'Ninlil.Dhcp.*'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Pack ${{ matrix.projects }}'
        env:
          BUILD_VERSION: '${{ needs.version.outputs.version }}'
          BUILD_PACKAGE_VERSION: '${{ needs.version.outputs.package-version }}'
          BUILD_ASSEMBLY_VERSION: '${{ needs.version.outputs.assembly-version }}'
        run: |-
          rm -rf packages
          ./.forgejo/scripts/pack-packages.sh '${{ matrix.projects }}' packages
        shell: 'bash'
      ##
      - name: 'Push to the Forgejo NuGet Registry'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
        run: |-
          # The feed's PackagePublish endpoint (see its index.json); a trailing slash is a 404.
          feed="${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/nuget"
          response="$(mktemp)"
          for package in packages/*.nupkg; do
            status="$(curl --silent --show-error --output "${response}" --write-out '%{http_code}' \
              --user "${NINLIL_CI_USER}:${NINLIL_CI_TOKEN}" \
              --upload-file "${package}" \
              "${feed}")"
            case "${status}" in
              201) echo "Pushed $(basename "${package}")" ;;
              # Already published by an earlier attempt of this same run.
              409) echo "Already published: $(basename "${package}")" ;;
              *)
                echo "::error::Pushing $(basename "${package}") failed with HTTP ${status}: $(cat "${response}")"
                exit 1
                ;;
            esac
          done
        shell: 'bash'
  ##
  publish:
    name: 'Publish Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
      - 'arch-packages'
      - 'image'
      - 'packages'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Publish the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          ./.forgejo/scripts/release.sh publish
        shell: 'bash'
