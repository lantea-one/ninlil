name: 'Ninlil Pipeline'
##
## The build, test, and publish pipeline shared by every entry point: branch builds
## (build.yml), release builds (release.yml), and pull-request verification (build.yml).
##
## Every compile and test runs inside Docker from the repository's own Dockerfile, so a runner
## needs only Docker (with buildx), git, curl, and jq -- never a matching .NET, Node.js, or Java
## installation. Every stage cross-compiles on the runner's own architecture, so any 'archlinux'
## runner can build every platform, including both container image architectures.
##
## Builds run on a BuildKit builder with explicit DNS servers (.forgejo/scripts/setup-builder.sh,
## overridable with the NINLIL_BUILD_DNS variable), because some runners resolve through a local
## DNS server that build steps cannot reach.
##
## Job graph:
##
##   version ─┬─ test-dotnet ────────┬─ draft ── binaries (×4) ── arch-packages ─┬─ publish
##            └─ test-admin-console ─┼─ image ───────────────────────────────────┤
##                                   └─ packages (×4) ───────────────────────────┘
##
## The draft release doubles as the hand-off between jobs: each binary job attaches its
## executable to it, the Arch Linux job builds its packages from the two Linux executables it
## downloads back from it, and publish turns the draft into the visible release.
##
on:
  workflow_call:
    inputs:
      ##
      kind:
        description: >-
          'prerelease' for a branch build, 'release' for a release branch build, or 'verify' to
          run only the tests (pull requests).
        required: true
        type: string
env:
  REGISTRY: 'git.lantea.one'
  IMAGE: 'git.lantea.one/lantea.one/ninlil'
  PLATFORMS: 'linux/amd64,linux/arm64'
jobs:
  ##
  version:
    name: 'Compute Version'
    if: >-
      inputs.kind != 'verify'
    runs-on: 'archlinux'
    outputs:
      version: '${{ steps.version.outputs.version }}'
      assembly-version: '${{ steps.version.outputs.assembly-version }}'
      package-version: '${{ steps.version.outputs.package-version }}'
      image-version: '${{ steps.version.outputs.image-version }}'
      arch-version: '${{ steps.version.outputs.arch-version }}'
      prerelease: '${{ steps.version.outputs.prerelease }}'
      short-sha: '${{ steps.version.outputs.short-sha }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          fetch-depth: 0
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Require Release Commits to Come From main'
        if: >-
          inputs.kind == 'release'
        run: |-
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ forgejo.sha }}" origin/main; then
            echo "::error::Release branch ${{ forgejo.ref_name }} points at ${{ forgejo.sha }}, which is not on main. Releases can only be cut from main."
            exit 1
          fi
        shell: 'bash'
      ##
      - name: 'Compute Version'
        id: 'version'
        env:
          BUILD_KIND: '${{ inputs.kind }}'
          REF_NAME: '${{ forgejo.ref_name }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
        run: |-
          ./.forgejo/scripts/compute-version.sh
        shell: 'bash'
  ##
  test-dotnet:
    name: 'Test .NET'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Select the Build Environment'
        env:
          NINLIL_BUILD_DNS: '${{ vars.NINLIL_BUILD_DNS }}'
        run: |-
          ./.forgejo/scripts/setup-builder.sh
        shell: 'bash'
      ##
      - name: 'Format Check and Build'
        run: |-
          docker buildx build --progress=plain --target test-dotnet --load \
            --tag "ninlil-test:${{ forgejo.run_id }}" .
        shell: 'bash'
      ##
      - name: 'Run Every Test Project'
        run: |-
          # Some tests start their own database containers through the Docker socket; host
          # networking lets them reach those containers' published ports on localhost and
          # resolve names the way the runner does. They run as the runner's own unprivileged
          # user (plus the Docker socket's group): on the host network that user cannot bind a
          # port below 1024 or open a raw socket, so no test can collide with, or answer for,
          # the DNS, DHCP, or web services already running on the runner.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c %g /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "ninlil-test:${{ forgejo.run_id }}"
        shell: 'bash'
      ##
      - name: 'Remove the Test Image'
        if: >-
          always()
        run: |-
          docker image rm --force "ninlil-test:${{ forgejo.run_id }}" || true
        shell: 'bash'
  ##
  test-admin-console:
    name: 'Test Admin Console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Select the Build Environment'
        env:
          NINLIL_BUILD_DNS: '${{ vars.NINLIL_BUILD_DNS }}'
        run: |-
          ./.forgejo/scripts/setup-builder.sh
        shell: 'bash'
      ##
      - name: 'Lint, Format Check, and Test'
        run: |-
          docker buildx build --progress=plain --target test-admin-console .
        shell: 'bash'
  ##
  draft:
    name: 'Stage Draft Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Create the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
          RELEASE_PRERELEASE: '${{ needs.version.outputs.prerelease }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
          COMMIT_SHA: '${{ forgejo.sha }}'
          REF_NAME: '${{ forgejo.ref_name }}'
        run: |-
          ./.forgejo/scripts/release.sh stage
        shell: 'bash'
  ##
  binaries:
    name: 'Build Binary (${{ matrix.binary }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'draft'
    runs-on: 'archlinux'
    strategy:
      matrix:
        binary:
          - 'linux-amd64'
          - 'linux-arm64'
          - 'macos-amd64'
          - 'macos-arm64'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Select the Build Environment'
        env:
          NINLIL_BUILD_DNS: '${{ vars.NINLIL_BUILD_DNS }}'
        run: |-
          ./.forgejo/scripts/setup-builder.sh
        shell: 'bash'
      ##
      - name: 'Build ninlil-${{ matrix.binary }}'
        run: |-
          rm -rf dist
          docker buildx build --progress=plain \
            --target binaries \
            --build-arg "NINLIL_BINARIES=${{ matrix.binary }}" \
            --build-arg "NINLIL_VERSION=${{ needs.version.outputs.version }}" \
            --build-arg "NINLIL_PACKAGE_VERSION=${{ needs.version.outputs.package-version }}" \
            --build-arg "NINLIL_ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}" \
            --output type=local,dest=dist \
            .
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          ./.forgejo/scripts/release.sh upload "dist/ninlil-${{ matrix.binary }}"
        shell: 'bash'
  ##
  arch-packages:
    name: 'Build Arch Linux Packages'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
    runs-on: 'archlinux'
    env:
      NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
      RELEASE_TAG: '${{ needs.version.outputs.version }}'
      ARCH_VERSION: '${{ needs.version.outputs.arch-version }}'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Fetch the Linux Binaries From the Draft Release'
        run: |-
          rm -rf dist
          ./.forgejo/scripts/release.sh download ninlil-linux-amd64 dist
          ./.forgejo/scripts/release.sh download ninlil-linux-arm64 dist
        shell: 'bash'
      ##
      - name: 'Build ninlil-bin for x86_64 and aarch64'
        run: |-
          ./.forgejo/scripts/arch-packages.sh dist
        shell: 'bash'
      ##
      - name: 'Attach to the Draft Release'
        run: |-
          ./.forgejo/scripts/release.sh upload dist/ninlil-bin-*.pkg.tar.zst
        shell: 'bash'
  ##
  image:
    name: 'Build and Push Image'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Select the Build Environment'
        env:
          NINLIL_BUILD_DNS: '${{ vars.NINLIL_BUILD_DNS }}'
        run: |-
          ./.forgejo/scripts/setup-builder.sh
        shell: 'bash'
      ##
      - name: 'Build and Push linux/amd64 and linux/arm64'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
          IMAGE_VERSION: '${{ needs.version.outputs.image-version }}'
          PRERELEASE: '${{ needs.version.outputs.prerelease }}'
        run: |-
          # Registry credentials live in a throwaway configuration directory for this job only,
          # never in the runner user's own ~/.docker, which every other job on this host shares.
          # (The builder itself is still found through BUILDX_CONFIG.)
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${NINLIL_CI_TOKEN}" \
            | docker login "${REGISTRY}" --username "${NINLIL_CI_USER}" --password-stdin

          # A pre-release is tagged with its own unique version only, so it can expire on its
          # own; a release is also tagged latest.
          tags=(--tag "${IMAGE}:${IMAGE_VERSION}")
          if [[ "${PRERELEASE}" == 'false' ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi

          docker buildx build --progress=plain \
            --platform "${PLATFORMS}" \
            --target runtime \
            --build-arg "NINLIL_VERSION=${{ needs.version.outputs.version }}" \
            --build-arg "NINLIL_PACKAGE_VERSION=${{ needs.version.outputs.package-version }}" \
            --build-arg "NINLIL_ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}" \
            --build-arg "NINLIL_REVISION=${{ forgejo.sha }}" \
            "${tags[@]}" \
            --provenance=false \
            --push \
            .
        shell: 'bash'
  ##
  packages:
    name: 'Pack and Push NuGet Packages (${{ matrix.family }})'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'test-dotnet'
      - 'test-admin-console'
    runs-on: 'archlinux'
    strategy:
      matrix:
        include:
          - family: 'common'
            projects: 'Ninlil.Common.*'
          - family: 'dns-core'
            projects: 'Ninlil.Dns.Common Ninlil.Dns.Data.* Ninlil.Dns.Identity'
          - family: 'dns-server'
            projects: 'Ninlil.Dns.Protocol.* Ninlil.Dns.Server.*'
          - family: 'dhcp'
            projects: 'Ninlil.Dhcp.*'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Select the Build Environment'
        env:
          NINLIL_BUILD_DNS: '${{ vars.NINLIL_BUILD_DNS }}'
        run: |-
          ./.forgejo/scripts/setup-builder.sh
        shell: 'bash'
      ##
      - name: 'Pack ${{ matrix.projects }}'
        run: |-
          rm -rf packages
          docker buildx build --progress=plain \
            --target packages \
            --build-arg "NINLIL_PACKAGES=${{ matrix.projects }}" \
            --build-arg "NINLIL_VERSION=${{ needs.version.outputs.version }}" \
            --build-arg "NINLIL_PACKAGE_VERSION=${{ needs.version.outputs.package-version }}" \
            --build-arg "NINLIL_ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}" \
            --output type=local,dest=packages \
            .
        shell: 'bash'
      ##
      - name: 'Push to the Forgejo NuGet Registry'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          NINLIL_CI_USER: '${{ vars.NINLIL_CI_USER }}'
        run: |-
          # The feed's PackagePublish endpoint (see its index.json); a trailing slash is a 404.
          feed="${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/nuget"
          response="$(mktemp)"
          for package in packages/*.nupkg; do
            status="$(curl --silent --show-error --output "${response}" --write-out '%{http_code}' \
              --user "${NINLIL_CI_USER}:${NINLIL_CI_TOKEN}" \
              --upload-file "${package}" \
              "${feed}")"
            case "${status}" in
              201) echo "Pushed $(basename "${package}")" ;;
              # Already published by an earlier attempt of this same run.
              409) echo "Already published: $(basename "${package}")" ;;
              *)
                echo "::error::Pushing $(basename "${package}") failed with HTTP ${status}: $(cat "${response}")"
                exit 1
                ;;
            esac
          done
        shell: 'bash'
  ##
  publish:
    name: 'Publish Release'
    if: >-
      inputs.kind != 'verify'
    needs:
      - 'version'
      - 'binaries'
      - 'arch-packages'
      - 'image'
      - 'packages'
    runs-on: 'archlinux'
    steps:
      ##
      - name: 'Checkout Sources'
        uses: 'actions/checkout@v7'
        with:
          clean: true
          ref: '${{ forgejo.sha }}'
      ##
      - name: 'Publish the Draft Release'
        env:
          NINLIL_CI_TOKEN: '${{ secrets.NINLIL_CI_TOKEN }}'
          RELEASE_TAG: '${{ needs.version.outputs.version }}'
        run: |-
          ./.forgejo/scripts/release.sh publish
        shell: 'bash'
