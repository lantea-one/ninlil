name: 'Release'
##
## A push to a branch named v<yyyy>.<mm>.<dd>.<increment> -- which must point at a commit on
## main -- builds, tests, and publishes a permanent release versioned
## v<yyyy>.<mm>.<dd>.<increment>R<short-sha>: binaries attached to the release, a container
## image tagged with the version and latest, and NuGet packages. A release version is published
## once; pushing the same release branch again with a different commit fails. It can also be
## started by hand on a release branch ("Run workflow" on the Actions page) to finish a release
## whose run was interrupted.
##
on:
  workflow_dispatch:
  push:
    branches:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'
concurrency:
  group: >-
    release-${{ forgejo.ref_name }}
  cancel-in-progress: false
jobs:
  ##
  pipeline:
    name: 'Pipeline'
    uses: './.forgejo/workflows/pipeline.yml'
    secrets: inherit
    with:
      kind: 'release'
