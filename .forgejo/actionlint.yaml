# Configuration for actionlint, read by .forgejo/scripts/lint.sh.
#
# actionlint knows only GitHub Actions. The runner labels the Forgejo workflows use are declared
# here so it does not report them as unknown:
#   asgard    the Linux runner that runs every Linux job
#   lofnheim  the Windows runner that runs the Windows smoke test and
#             the Windows test suite
self-hosted-runner:
  labels:
    - asgard
    - lofnheim
paths:
  # test-dotnet passes a single-quoted script to `bash -c` in the container on purpose: the
  # outer shell must not expand ${timing_sensitive}, the inner one does. lint.sh copies the
  # workflows to .github/workflows, hence the path.
  .github/workflows/pipeline.yml:
    ignore:
      - 'SC2016:info:.*'
      # The test jobs upload their results with the Forgejo build of the upload action, written as
      # a full URL because the upstream action refuses to run outside GitHub. actionlint accepts
      # only {owner}/{repo}@{ref}. Only that one repository is exempt.
      - 'specifying action "https://code\.forgejo\.org/forgejo/upload-artifact@[0-9a-f]{40}" in invalid format.*'
