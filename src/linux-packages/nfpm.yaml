# nFPM configuration for the ninlil Deb and RPM packages. .forgejo/scripts/linux-packages.sh runs
# nFPM once per architecture and format, from the repository root, with the environment below.
#
# The packages install exactly what the Arch Linux package does (src/archlinux/ninlil/PKGBUILD.in):
# the server at /usr/lib/ninlil/ninlil, a ninlil.service systemd unit that runs it as the
# unprivileged ninlil user, all state in /var/lib/ninlil, and the environment file at
# /etc/ninlil/ninlil.env. The unit, sysusers entry and environment file are shared with the Arch
# packages and live in src/archlinux/common.
#
# Environment:
#   NFPM_ARCH      amd64 or arm64 (nFPM maps it to x86_64/aarch64 for RPM)
#   PKG_VERSION    the package version (compute-version.sh: deb-version or rpm-version)
#   PKG_RELEASE    the RPM release (compute-version.sh: rpm-release); empty for a Deb, which
#                  carries everything in PKG_VERSION
#   NINLIL_BINARY  path of the ninlil-linux-<arch> executable to package
#   NINLIL_COMMON  path of src/archlinux/common
#   NINLIL_LICENSE path of the repository's LICENSE file
#
# nFPM reads the script paths relative to its working directory, so it must run from the
# repository root. It expands ${...} in the file's own fields and in contents entries marked
# "expand: true", but not in script paths.
name: ninlil
arch: ${NFPM_ARCH}
platform: linux
# The date-based versions are not semantic versions ("2026.10.09.3~develop.a1b2c3d").
version_schema: none
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
section: net
priority: optional
maintainer: Freja Abigail <frejagail@gmail.com>
description: |-
  DNS, DHCPv4/DHCPv6 and Router Advertisement server
  Ninlil is a DNS, DHCPv4, DHCPv6 and Router Advertisement server with a REST API and a web
  admin console. The package installs the self-contained executable, a systemd unit and an
  environment file. The service is not enabled or started on install: run
  "systemctl enable --now ninlil".
vendor: Ninlil
homepage: https://git.lantea.one/lantea-one/ninlil
license: MIT

# The executable is self-contained; it needs only the C and C++ runtime libraries, OpenSSL and
# ICU. ICU's package name carries its major version on Debian and Ubuntu, so the releases the
# supported distributions ship are listed (Ubuntu 22.04: 70, Debian 12: 72, Ubuntu 24.04: 74,
# Debian 13: 76). OpenSSL is libssl3 on Debian 12 and Ubuntu 22.04 and libssl3t64 on Ubuntu 24.04.
depends:
  - libc6
  - libstdc++6
  - libssl3 | libssl3t64
  - libicu76 | libicu74 | libicu72 | libicu70
# DNS-over-QUIC needs libmsquic 2.4.20 or later: older releases abort the whole process when a
# QUIC peer advertises the minimum UDP payload size (1200 bytes) over IPv4. Deb and RPM write the
# version constraint differently, so the RPM override repeats it in RPM syntax.
suggests:
  - libmsquic (>= 2.4.20)
overrides:
  rpm:
    depends:
      - glibc
      - libstdc++
      - openssl-libs
      - libicu
    suggests:
      - libmsquic >= 2.4.20

contents:
  - src: ${NINLIL_BINARY}
    expand: true
    dst: /usr/lib/ninlil/ninlil
    file_info:
      mode: 0755
  # The server keeps its data directory next to the executable; point it at the state directory.
  - src: /var/lib/ninlil
    dst: /usr/lib/ninlil/data
    type: symlink
  # An empty web root: the admin console is served from inside the executable, but ASP.NET Core
  # would otherwise try to create the web root it is given in the read-only /usr/lib.
  - dst: /usr/lib/ninlil/wwwroot
    type: dir
    file_info:
      mode: 0755
  - src: ${NINLIL_COMMON}/ninlil.service
    expand: true
    dst: /usr/lib/systemd/system/ninlil.service
    file_info:
      mode: 0644
  - src: ${NINLIL_COMMON}/ninlil.sysusers
    expand: true
    dst: /usr/lib/sysusers.d/ninlil.conf
    file_info:
      mode: 0644
  # A conffile on Debian and %config(noreplace) on RPM: an upgrade keeps the administrator's edits.
  - src: ${NINLIL_COMMON}/ninlil.env
    expand: true
    dst: /etc/ninlil/ninlil.env
    type: config|noreplace
    file_info:
      mode: 0640
  # Not /usr/share/doc: minimal Debian and Ubuntu images exclude that directory from installs.
  - src: ${NINLIL_LICENSE}
    expand: true
    dst: /usr/share/licenses/ninlil/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: src/linux-packages/scripts/postinstall.sh
  preremove: src/linux-packages/scripts/preremove.sh
  postremove: src/linux-packages/scripts/postremove.sh
