<div class="list-header">
  <h1>Cloud Provider Credentials</h1>
  <a
    *appIfPermission="'cloudprovidercredentials:write'"
    cButton
    color="primary"
    routerLink="/cloud-provider-credentials/new"
  >
    <svg cIcon name="cilPlus" size="sm"></svg>
    New credential set
  </a>
</div>

@if (errorMessage()) {
  <p class="error-message">{{ errorMessage() }}</p>
}

@if (loading()) {
  <c-spinner class="loading-spinner" />
} @else if (credentials().length === 0) {
  <app-empty-state
    icon="cilCloud"
    heading="No cloud provider credentials yet"
    description="Create one to sync a CloudPrimary/CloudSecondary zone."
  >
    <a
      *appIfPermission="'cloudprovidercredentials:write'"
      cButton
      color="primary"
      routerLink="/cloud-provider-credentials/new"
    >
      <svg cIcon name="cilPlus" size="sm"></svg>
      New credential set
    </a>
  </app-empty-state>
} @else {
  <div class="table-card">
    <table cdk-table cTable hover responsive [dataSource]="credentials()" class="credential-table">
      <ng-container cdkColumnDef="name">
        <th cdk-header-cell *cdkHeaderCellDef>Name</th>
        <td cdk-cell *cdkCellDef="let credential">{{ credential.name }}</td>
      </ng-container>

      <ng-container cdkColumnDef="providerType">
        <th cdk-header-cell *cdkHeaderCellDef>Provider</th>
        <td cdk-cell *cdkCellDef="let credential">
          <c-badge color="info">{{ credential.providerType }}</c-badge>
        </td>
      </ng-container>

      <ng-container cdkColumnDef="disabled">
        <th cdk-header-cell *cdkHeaderCellDef>Status</th>
        <td cdk-cell *cdkCellDef="let credential">
          <button
            cButton
            size="sm"
            variant="ghost"
            [color]="credential.isDisabled ? 'secondary' : 'success'"
            [cTooltip]="
              credential.isDisabled ? 'Enable this credential set' : 'Disable this credential set'
            "
            [disabled]="!('cloudprovidercredentials:write' | hasPermission)"
            (click)="toggleDisabled(credential)"
          >
            {{ credential.isDisabled ? 'Disabled' : 'Enabled' }}
          </button>
        </td>
      </ng-container>

      <ng-container cdkColumnDef="actions">
        <th cdk-header-cell *cdkHeaderCellDef></th>
        <td cdk-cell *cdkCellDef="let credential" class="actions-cell">
          <a
            *appIfPermission="'cloudprovidercredentials:write'"
            cButton
            size="sm"
            variant="ghost"
            color="secondary"
            [routerLink]="['/cloud-provider-credentials', credential.id, 'edit']"
            cTooltip="Edit credential set"
            aria-label="Edit credential set"
          >
            <svg cIcon name="cilPencil" size="sm"></svg>
          </a>
          <button
            *appIfPermission="'cloudprovidercredentials:write'"
            cButton
            size="sm"
            variant="ghost"
            color="danger"
            cTooltip="Delete credential set"
            aria-label="Delete credential set"
            (click)="deleteCredential(credential)"
          >
            <svg cIcon name="cilTrash" size="sm"></svg>
          </button>
        </td>
      </ng-container>

      <tr cdk-header-row *cdkHeaderRowDef="displayedColumns"></tr>
      <tr cdk-row *cdkRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <app-coreui-pagination
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [totalCount]="totalCount()"
      (pageChange)="onPageChange($event)"
    />
  </div>
}

<app-confirm-dialog
  [visible]="confirmDialogVisible()"
  [data]="confirmDialogData()"
  (resolved)="onConfirmDialogResolved($event)"
/>
