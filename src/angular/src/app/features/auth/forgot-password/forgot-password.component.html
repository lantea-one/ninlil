<div class="forgot-password-page">
  <div class="forgot-password-brand">
    <svg cIcon name="cilLan" size="xxl" class="forgot-password-brand-icon"></svg>
    <span class="forgot-password-brand-text">Ninlil</span>
  </div>

  <c-card class="forgot-password-card shadow-lg border-0">
    <c-card-header class="d-flex align-items-center gap-2">
      <svg cIcon name="cilEnvelopeClosed" size="lg"></svg>
      <strong>Forgot your password?</strong>
    </c-card-header>

    <c-card-body>
      @if (completed()) {
        <c-alert color="success" [dismissible]="false" role="alert">
          {{ confirmationMessage() }}
        </c-alert>
        <a cButton color="primary" class="w-100" routerLink="/login">Back to sign in</a>
      } @else {
        <p class="text-body-secondary">
          Enter the e-mail address on your account, and we'll send you a link to set a new password.
        </p>

        <form cForm [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label cLabel for="forgot-password-email">E-mail address</label>
            <input
              cFormControl
              id="forgot-password-email"
              type="email"
              formControlName="email"
              autocomplete="email"
            />
          </div>

          @if (errorMessage()) {
            <c-alert color="danger" [dismissible]="false" role="alert">{{
              errorMessage()
            }}</c-alert>
          }

          <button
            cButton
            color="primary"
            type="submit"
            class="w-100 mb-2"
            [disabled]="form.invalid || submitting()"
          >
            @if (submitting()) {
              <c-spinner size="sm" />
            } @else {
              Send reset link
            }
          </button>

          <a cButton color="secondary" variant="ghost" class="w-100" routerLink="/login">
            Back to sign in
          </a>
        </form>
      }
    </c-card-body>
  </c-card>
</div>
