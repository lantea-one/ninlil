<c-modal
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [backdrop]="'static'"
  [keyboard]="false"
  alignment="center"
>
  <c-modal-header>
    <h5 cModalTitle>{{ data()?.title }}</h5>
  </c-modal-header>

  <c-modal-body>
    <p class="warning">{{ data()?.message }}</p>

    @for (secret of data()?.secrets ?? []; track secret.label) {
      <div class="secret-row">
        <span class="secret-label">{{ secret.label }}</span>
        <code class="secret-value">{{ secret.value }}</code>
        <button
          cButton
          size="sm"
          variant="ghost"
          type="button"
          [cTooltip]="copiedLabel() === secret.label ? 'Copied!' : 'Copy to clipboard'"
          [attr.aria-label]="'Copy ' + secret.label + ' to clipboard'"
          (click)="copy(secret)"
        >
          <svg
            cIcon
            [name]="copiedLabel() === secret.label ? 'cilCheck' : 'cilCopy'"
            size="sm"
          ></svg>
        </button>
      </div>
    }
  </c-modal-body>

  <c-modal-footer>
    <button cButton color="primary" type="button" (click)="dismiss()">
      I've saved this -- close
    </button>
  </c-modal-footer>
</c-modal>
